<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNPJ — Fake Data Easy</title>
    <link rel="stylesheet" href="../popup/styles.css" />
  </head>
  <body>
    <div class="shell page-options">
      <div class="logo-wrap">
        <img class="logo" src="/assets/FakeDataEasy2.png" alt="" width="160" height="auto" />
      </div>

      <form id="cnpj-form" class="options-form">
        <div class="field-row">
          <input id="cnpj-input" type="text" inputmode="numeric" autocomplete="off" placeholder="CNPJ" maxlength="18" />
          <button type="button" id="cnpj-gerar" class="btn-gerar">↻ Gerar</button>
        </div>

        <div class="radio-row">
          <label>
            <input type="radio" name="cnpjMask" value="1" />
            Com pontos
          </label>
          <label>
            <input type="radio" name="cnpjMask" value="0" checked />
            Sem pontos
          </label>
        </div>

        <div class="page-actions">
          <a class="btn-back" href="../popup/index.html" title="Menu">←</a>
          <button type="button" class="btn-soon" disabled>Exportar lista (Em breve)</button>
        </div>
      </form>
    </div>
    <script type="module" src="./cnpj.ts"></script>
  </body>
</html>
